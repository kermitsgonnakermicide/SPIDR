amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "spooder/base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_beams: 60
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "spooder/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 2.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_frame: spooder/odom
    global_frame: map
    robot_base_frame: spooder/base_footprint
    transform_tolerance: 2.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    cycle_frequency: 10.0
    spin:
      plugin: "nav2_behaviors::Spin"
      local_frame: spooder/odom
    backup:
      plugin: "nav2_behaviors::BackUp"
      local_frame: spooder/odom
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      local_frame: spooder/odom
    odom_topic: /odom

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: spooder/base_footprint
    odom_topic: /odom
    local_frame: spooder/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.100
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      vtheta_std: 0.1
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.0
      vtheta_max: 0.5
      vtheta_min: -0.5
      iteration_count: 1
      pruning_distance: 1.7
      transform_tolerance: 2.0
      enforce_path_costs: true
      visualize: true
      motion_model: "DiffDrive"
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "ObstaclesCritic"]
      ConstraintCritic.cost_weight: 4.0
      GoalCritic.cost_weight: 4.0
      GoalAngleCritic.cost_weight: 3.0
      PathAlignCritic.cost_weight: 5.0
      PathFollowCritic.cost_weight: 5.0
      PathAngleCritic.cost_weight: 3.0
      ObstaclesCritic.cost_weight: 6.0
      ObstaclesCritic.consider_footprint: true
      ObstaclesCritic.collision_cost: 1000000.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      use_cost_map: true
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: spooder/base_footprint
      use_sim_time: True
      footprint: "[ [0.10, 0.10], [0.10, -0.10], [-0.10, -0.10], [-0.10, 0.10] ]"
      resolution: 0.05
      rolling_window: true
      width: 20
      height: 20
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /map
        subscribe_to_updates: True
        transform_tolerance: 2.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: spooder/odom
      robot_base_frame: spooder/base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.10, 0.10], [0.10, -0.10], [-0.10, -0.10], [-0.10, 0.10] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "spooder/base_footprint"
    odom_frame_id: "spooder/odom"
    transform_tolerance: 0.1
    source_timeout: 0.5
    base_shift_correction: True
    observation_sources: ["scan"]
    polygons: ["Footprint"]
    Footprint:
      type: "polygon"
      prediction_type: "none"
      points: "[[0.10, 0.10], [0.10, -0.10], [-0.10, -0.10], [-0.10, 0.10]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_height: 0.0
      max_height: 0.6
    scan:
      type: "scan"
      topic: "/scan"

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    dock_plugins: ["simple_dock"]
    simple_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.1
      staging_timeout: 300.0
