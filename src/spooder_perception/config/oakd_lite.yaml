# OAK-D Lite Configuration for depthai_ros_driver
# Reference: https://docs.luxonis.com/projects/hardware/en/latest/pages/SR/S2.html
#
# Stereo depth camera:
#   - Baseline: 7.5 cm
#   - Resolution: 640x400 (stereo), 1280x720 (RGB)
#   - Depth range: 0.2 - 10.0 m
#   - FOV: ~71 degrees horizontal
#   - IMU: BMI270 (3-axis accel + 3-axis gyro)

/**:
  ros__parameters:
    camera:
      i_pipeline_type: 'Depth'
      i_tf_camera_model: 'OAK-D-LITE'
      i_tf_camera_name: 'oak_d'
      i_tf_parent_frame: 'spooder/base_link'
      i_publish_tf_from_calibration: true
      i_enable_ir: false
      i_nn_type: none

    pipeline_gen:
      i_enable_imu: true
      i_board_socket_left: 1
      i_board_socket_right: 2
      i_board_socket_rgb: 3
      i_usb_speed: SUPER_PLUS

    left:
      i_resolution: '400P'
      i_publish_topic: true
      i_fps: 30.0

    right:
      i_resolution: '400P'
      i_publish_topic: true
      i_fps: 30.0

    stereo:
      i_width: 640
      i_height: 400
      i_subpixel: true
      i_lr_check: true
      i_publish_topic: true
      i_align_depth: true
      i_output_disparity: false
      i_output_depth: true
      i_depth_preset: 'HIGH_ACCURACY'
      i_fps: 30.0

    rgb:
      i_disable_node: false
      i_resolution: '720P'
      i_fps: 30.0
      i_publish_topic: true

    imu:
      i_publish_topic: true
      i_max_batch_reports: 50
      i_accel_freq: 100
      i_gyro_freq: 100
      i_accel_range: 4.0
      i_gyro_range: 1000.0
      i_rotation: -90.0

    # Sub-pixel + LR-check optimize depth accuracy at near ranges
    calibration:
      i_check_stereo_quality: true
