pointcloud_optimizer:
  ros__parameters:
    input_topic: "/camera/points"
    output_topic: "/camera/points/optimized"

    # Scene-change resolution. Higher values are faster and less sensitive to
    # depth-camera noise; lower values react to smaller geometry changes.
    voxel_size: 0.05

    # Live-stream optimization for Nav2/terrain analysis. The persistent saved
    # map still consumes raw camera points and optimizes what it keeps.
    min_changed_voxels: 150
    change_ratio: 0.02

    # Limit publish rate while the scene is genuinely changing.
    min_publish_interval: 0.2

    # OctoMap needs periodic frames from new viewpoints even when voxel keys
    # look unchanged.
    force_publish_interval: 0.5

    range_min: 0.05
    range_max: 8.0
    max_output_points: 120000

pointcloud_saver:
  ros__parameters:
    input_topic: "/camera/points"
    map_topic: "/spooder/map_points"

    # Voxel grid resolution for downsampling (meters)
    voxel_size: 0.05

    # Existing map voxels are updated only if the new sample moves this far.
    dist_threshold: 0.01

    # Publish the persistent optimized map for RViz only when kept voxels change.
    map_publish_interval: 1.0
    
    # Maximum number of points to store in memory
    max_points: 1000000
    
    # Auto-save interval in seconds (0 = disabled)
    # Set to 60.0 for automatic saves every minute
    auto_save_interval: 0.0
    
    # Directory to save PCD files
    output_directory: "~/spooder_maps"
    
    # Target frame for accumulated point cloud
    map_frame: "map"

terrain_analyzer:
  ros__parameters:
    input_topic: "/camera/points"

octomap_terrain_adapter:
  ros__parameters:
    input_topic: "/octomap_server/octomap_point_cloud_centers"
    traversability_topic: "/terrain/traversability"
    terrain_height_topic: "/perception/terrain_height"
    debug_topic: "/perception/debug_terrain_pc"
    map_frame: "map"
    base_frame: "spooder/base_footprint"
    resolution: 0.05
    width_m: 20.0
    height_m: 8.0
    publish_rate: 2.0
    floor_ignore_z: 0.04
    climbable_min_z: 0.05
    climbable_max_z: 0.20
    lethal_min_z: 0.22
    lethal_max_z: 0.38
    overhead_min_z: 0.40
    climbable_cost: 35
    lethal_cost: 100
    roi_x_min: 0.2
    roi_x_max: 0.8
    roi_y_min: -0.3
    roi_y_max: 0.3
