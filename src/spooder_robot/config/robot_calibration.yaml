# Per-joint calibration for the physical ST3215 servos.
#
# Total: **18 servos** = 6 legs (rf, rm, rr, lf, lm, lr) × 3 joints
# each (coxa, femur, tibia). The list below has 18 entries in the
# spooder.xacro order: groups of 3 per leg, in the same order as
# JOINT_ORDER in `spooder_robot/gait_node.py`. If a count disagrees
# between this file and the bringup launch's URDF xacro, the runtime
# will fail at JointGroupPositionController spawn time -- fix it here.
#
# Every entry below is the source of truth at robot boot. If you've already
# captured `hexapod_config.json` from the Tk app, the calibration loader
# (`spooder_robot.calibration`) will accept either this YAML or a JSON file
# with the same fields and convert the 12-bit-step values to radians on load.
#
# Joint order in spooder.xacro is `prefix_{coxa,femur,tibia}_joint`. The
# motor encoder convention in ``spooder_hardware/ST3215System`` is
# radians (range -pi..pi centre 0); so:
#
#   servo_zero_offset_rad : added to the IK result before it's written
#                           to the bus. Brings your measured at-rest
#                           encoder position to "physical home".
#   soft_limit_rad        : sign-aware soft stop, tighter than the URDF
#                           (which has very loose limits).
#   invert                : true if the servo shaft rotates the wrong way
#                           relative to the URDF convention. The leg-mount
#                           issue on the physical rig (left-side coxa
#                           mirrored) should be set here once and left
#                           off in gait data -- the gait layer then
#                           doesn't need to know.
#
# Default offsets are zero so a fresh boot parks at joint=0 rad on every
# servo (which is the URDF's nominal standing pose). After the first
# power-on, copy the measured encoder positions here so the robot starts
# at the physically-realistic standing pose each time -- until you do
# that, the body may sit crooked or knees may bend the wrong way.

spooder_robot:
  ros__parameters:
    # Drop your hexapod_config.json in here (the Tk app exports one):
    #   calibration_json_path: "/home/daksh/spooder_ws/hexapod_config.json"
    # Leaving it empty makes the loader fall back to the YAML table.
    calibration_json_path: ""

    joints:
      rf_coxa_joint:  {servo_id: 1,  offset_rad: 0.0, soft_limit_rad: 0.3927, invert: false}
      rf_femur_joint: {servo_id: 2,  offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}
      rf_tibia_joint: {servo_id: 3,  offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}

      rm_coxa_joint:  {servo_id: 4,  offset_rad: 0.0, soft_limit_rad: 0.3927, invert: false}
      rm_femur_joint: {servo_id: 5,  offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}
      rm_tibia_joint: {servo_id: 6,  offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}

      rr_coxa_joint:  {servo_id: 7,  offset_rad: 0.0, soft_limit_rad: 0.3927, invert: false}
      rr_femur_joint: {servo_id: 8,  offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}
      rr_tibia_joint: {servo_id: 9,  offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}

      lf_coxa_joint:  {servo_id: 10, offset_rad: 0.0, soft_limit_rad: 0.3927, invert: true}
      lf_femur_joint: {servo_id: 11, offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}
      lf_tibia_joint: {servo_id: 12, offset_rad: 0.0, soft_limit_rad: 0.5236, invert: true}

      lm_coxa_joint:  {servo_id: 13, offset_rad: 0.0, soft_limit_rad: 0.3927, invert: true}
      lm_femur_joint: {servo_id: 14, offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}
      lm_tibia_joint: {servo_id: 15, offset_rad: 0.0, soft_limit_rad: 0.5236, invert: true}

      lr_coxa_joint:  {servo_id: 16, offset_rad: 0.0, soft_limit_rad: 0.3927, invert: true}
      lr_femur_joint: {servo_id: 17, offset_rad: 0.0, soft_limit_rad: 0.5236, invert: false}
      lr_tibia_joint: {servo_id: 18, offset_rad: 0.0, soft_limit_rad: 0.5236, invert: true}
