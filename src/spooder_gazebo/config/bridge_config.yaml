# Fallback bridge config for launch files that do not generate their own config.
# 01_sim_world.launch.py writes a world-specific version at runtime.
# NOTE: There is intentionally NO leading "---" doc separator here.
# ros_gz_bridge uses YAML::Load() which treats a top-level sequence with a
# leading "---" oddly (depends on yaml-cpp version). Removing it keeps the
# parse path identical across yaml-cpp versions and avoids duplicate bridges.

# CLOCK - default test_world fallback
- ros_topic_name: "/clock"
  gz_topic_name: "/world/test_world/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# IMU
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ODOMETRY - from the OdometryPublisher plugin
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# CMD_VEL
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# DEPTH CAMERA - RGB Image
- ros_topic_name: "/camera/image"
  gz_topic_name: "/camera/image"
