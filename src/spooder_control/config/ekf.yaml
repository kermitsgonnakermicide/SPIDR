### ekf config file ###
# 2D mode: stable flat TF. IMU fused for yaw-velocity only (no orientation, no accel).
# TF: spooder/odom -> spooder/base_footprint is flat (roll/pitch ignored).
# Tilt awareness via robot_state_viz node (reads /odom from Gazebo, not EKF).
ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        two_d_mode: true
        publish_acceleration: false
        publish_tf: true
        map_frame: map
        odom_frame: spooder/odom
        base_link_frame: spooder/base_footprint
        world_frame: spooder/odom

        # Fuse simulated odometry (position + velocity) — flat 2D only
        odom0: /odom
        odom0_config: [true,  true,  false,
                       false, false, true,
                       true,  true,  false,
                       false, false, true,
                       false, false, false]
        odom0_relative: false
        odom0_differential: false

        # Fuse IMU — angular velocity yaw only (no orientation, no acceleration)
        imu0: /imu
        imu0_config: [false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_differential: false
        imu0_relative: false
