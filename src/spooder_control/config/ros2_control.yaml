controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    spooder_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - R11
      - R12
      - R13
      - R21
      - R22
      - R23
      - R31
      - R32
      - R33
      - L11
      - L12
      - L13
      - L21
      - L22
      - L23
      - L31
      - L32
      - L33
    interfaces:
      - position
      - velocity

spooder_controller:
  ros__parameters:
    joints:
      - R11
      - R12
      - R13
      - R21
      - R22
      - R23
      - R31
      - R32
      - R33
      - L11
      - L12
      - L13
      - L21
      - L22
      - L23
      - L31
      - L32
      - L33

