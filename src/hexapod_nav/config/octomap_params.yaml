octomap_server:
  ros__parameters:
    resolution: 0.05
    frame_id: "map"
    base_frame_id: "spooder/base_footprint"
    height_map: false
    colored_map: false
    sensor_model:
      max_range: 5.0
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97
    publish_free_space: false
    latch: true
    filter_ground: true
    ground_detection:
      max_distance: 0.15
      min_distance: 0.0
    # Publish 2D projected OccupancyGrid on /projected_map for Nav2 static_layer + RViz
    publish_2d_map: true
    # Height filters: wide range for fully-3D worlds with overhangs
    point_cloud_min_z: -0.5
    point_cloud_max_z: 2.0
    occupancy_min_z: -0.3
    occupancy_max_z: 2.0
