global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.25
      resolution: 0.10             # Coarser than OctoMap — body path only
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: octomap_cloud
        octomap_cloud:
          topic: /octomap_point_cloud_centers
          sensor_frame: camera_link
          observation_persistence: 0.5
          expected_update_rate: 5.0
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05  # ignore floor
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35

local_costmap:
  local_costmap:
    ros__parameters:
      # Nav2 local planner is NOT used for foot placement.
      # It controls body velocity only.
      width: 3
      height: 3
      resolution: 0.05
      rolling_window: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.08       # Hexapod max speed (slow)
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false