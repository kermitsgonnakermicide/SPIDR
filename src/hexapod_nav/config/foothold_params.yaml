terrain_cost_node:
  ros__parameters:
    w_slope: 1.0
    w_roughness: 0.8
    w_unknown: 0.5
    w_friction: 0.6
    surface_friction_coefficient: 0.8
    min_swing_height: 0.02
    strict_unknown: false

foothold_planner_node:
  ros__parameters:
    replan_cost_threshold: 0.5
    # matches gait_controller_node Python default; foot Z in coxa frame.
    # body_clearance is now 0.135 (spooder.xacro base_joint) — see kinematics.py.
    # -0.140 = -body_clearance - 0.005 ground_compression for stable contact.
    nominal_stance_height: -0.140
    aep_forward_offset: 0.15
    pep_backward_offset: 0.15

gait_controller_node:
  ros__parameters:
    swing_duration: 0.5
    max_swing_height: 0.06
    step_frequency: 20.0
    # matches gait_controller_node Python default; foot Z in coxa frame.
    # -0.140 = -body_clearance(0.135) - 0.005 ground_compression for stable contact.
    # See gait_controller_node.py and memory [[feedback-hexapod-rest-pose]] for
    # the rationale; the previous value -0.158 was unreachable for this leg geometry.
    nominal_stance_height: -0.140
    nominal_stance_forward: 0.085
